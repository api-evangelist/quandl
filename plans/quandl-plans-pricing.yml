notes: The Quandl pricing page (data.nasdaq.com/pricing) returned 404 during reconciliation, and the
  Nasdaq Data Link documentation does not surface concrete subscription rates for premium datasets.
  Free open data is available with anonymous and authenticated access; premium datasets are sold on
  a per-dataset subscription that is configured at checkout. Reconciliation flagged false until subscription
  rates can be confirmed against the live pricing surface.
description: Nasdaq Data Link (formerly Quandl) hosts both free open data (central banks, government
  series) and premium datasets sold per-subscription. The platform does not publish a single tier table;
  pricing is per-dataset and surfaced inside the data.nasdaq.com checkout flow.
sources:
  - https://data.nasdaq.com/
  - https://docs.data.nasdaq.com/
plans:
  - id: quandl-contact-sales
    name: Contact Sales / Per-Dataset Subscription
    type: enterprise
    description: Premium datasets on Nasdaq Data Link are sold on individual per-dataset subscriptions
      configured inside the data.nasdaq.com catalog; enterprise multi-dataset contracts are arranged
      with the Nasdaq Data Link sales team. Free open data is accessible to authenticated accounts at
      no charge.
    entries:
      - label: Free Open Data
        name: free_open_data
        type: flat
        metric: dataset
        limit: -1
        timeFrame: usage
        unit: 1
        price: '$0'
        userMultiplied: false
      - label: Premium Dataset Subscription
        name: premium_subscription
        type: subscription
        metric: dataset
        limit: -1
        timeFrame: month
        unit: 1
        price: see https://data.nasdaq.com/
        userMultiplied: false
      - label: Enterprise Multi-Dataset
        name: enterprise_engagement
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
