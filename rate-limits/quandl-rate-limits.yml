specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Quandl (Nasdaq Data Link)
providerId: quandl
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Finance
  - Market Data
  - Rate Limiting
notes: The Nasdaq Data Link documentation (docs.data.nasdaq.com) does not surface a single canonical
  rate-limit page in the entry-level guides reachable during reconciliation; the legacy Quandl REST
  API historically allowed up to 50,000 calls per day for authenticated users versus 50/day for anonymous
  callers, but those numbers should be re-verified against the current Nasdaq Data Link operational
  guidance before treating them as authoritative. Reconciled flagged false.
description: Rate-limit numbers for Nasdaq Data Link are not exposed on a public rate-limits page; the
  REST and Streaming surfaces apply per-account throttling that historically distinguished anonymous,
  free-authenticated, and premium-subscription accounts.
sources:
  - https://docs.data.nasdaq.com/
  - https://data.nasdaq.com/
limits:
  - name: Per-Account Throttle
    scope: api-key
    metric: varies
    limit: see Nasdaq Data Link operational guidance
    notes: Historical Quandl tiers were 50/day anonymous and up to 50,000/day authenticated; current
      Nasdaq Data Link numbers must be re-verified in the docs portal before use.
policies:
  - name: Authentication Required
    description: Anonymous access is heavily throttled; authenticated requests using a Nasdaq Data Link
      API key receive substantially higher quotas.
  - name: Backoff Strategy
    description: Clients should apply exponential backoff with jitter when receiving 429 responses;
      premium dataset entitlements are enforced separately from request-rate throttling.
maintainers:
