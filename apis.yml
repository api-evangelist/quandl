aid: quandl
name: Quandl (Nasdaq Data Link)
description: >-
  Nasdaq Data Link (formerly Quandl) provides REST and streaming APIs for financial and economic data including
  time-series datasets, tabular datasets, and real-time market data feeds. Datasets cover stock prices, economic
  indicators, interest rates, commodities, equity fundamentals, options data, and alternative data sets.
