apis:
- aid: quandl:nasdaq-data-link-rest-api
  name: Nasdaq Data Link REST API (Time-Series)
  tags:
  - Finance
  - Economic Data
  - Time Series
  - Market Data
  - REST
  image: https://raw.githubusercontent.com/api-evangelist/quandl/refs/heads/main/image.png
  humanURL: https://docs.data.nasdaq.com/
  baseURL: https://data.nasdaq.com/api/v3
  properties:
  - url: https://docs.data.nasdaq.com/
    type: Documentation
  - url: https://docs.data.nasdaq.com/
    type: Reference
  - url: https://docs.data.nasdaq.com/docs/getting-started
    type: GettingStarted
  - url: https://docs.data.nasdaq.com/docs/rate-limits
    type: RateLimits
  - url: https://docs.data.nasdaq.com/docs/python-installation
    type: SDKs
  description: >-
    Nasdaq Data Link REST API (formerly Quandl) provides access to financial and economic time-series datasets including stock prices, economic indicators, interest rates, and commodity data in JSON, XML, and CSV formats. Authenticated users receive up to 50,000 calls per day.

- aid: quandl:nasdaq-data-link-tables-api
  name: Nasdaq Data Link Tables REST API
  tags:
  - Finance
  - Market Data
  - Tables
  - REST
  image: https://raw.githubusercontent.com/api-evangelist/quandl/refs/heads/main/image.png
  humanURL: https://docs.data.nasdaq.com/
  baseURL: https://data.nasdaq.com/api/v3
  properties:
  - url: https://docs.data.nasdaq.com/
    type: Documentation
  - url: https://docs.data.nasdaq.com/docs/rate-limits-1
    type: RateLimits
  description: >-
    Nasdaq Data Link Tables API provides access to tabular financial datasets including equity fundamentals, options data, and alternative data sets. Limited to 10,000 rows per call with pagination support up to 1,000,000 rows via the Python client.

- aid: quandl:nasdaq-cloud-data-service-api
  name: Nasdaq Cloud Data Service (NCDS) Streaming API
  tags:
  - Finance
  - Market Data
  - Streaming
  - Real-time
  - REST
  image: https://raw.githubusercontent.com/api-evangelist/quandl/refs/heads/main/image.png
  humanURL: https://github.com/Nasdaq/NasdaqCloudDataService-REST-API
  baseURL: https://api.nasdaq.com
  properties:
  - url: https://github.com/Nasdaq/NasdaqCloudDataService-REST-API
    type: Documentation
  - url: https://github.com/Nasdaq/NasdaqCloudDataService-SDK-Python
    type: SDKs
  - url: https://github.com/Nasdaq/NasdaqCloudDataService-SDK-Java
    type: SDKs
  description: >-
    Nasdaq Cloud Data Service (NCDS) provides streaming and REST APIs for real-time and delayed market data delivery including equities, options, and fixed income from Nasdaq exchange feeds.

