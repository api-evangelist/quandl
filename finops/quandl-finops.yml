notes: Nasdaq Data Link does not publish a public per-dataset price list or a usage telemetry API;
  premium dataset prices are surfaced inside the data.nasdaq.com catalog and enterprise pricing is
  contracted via Nasdaq sales. FOCUS columns are populated at the publisher level; per-dataset meters
  are listed but rates are intentionally left unreconciled.
description: FOCUS-aligned FinOps for Nasdaq Data Link (Quandl) - per-dataset subscription fees plus
  enterprise multi-dataset contracts; pricing is set inside the catalog rather than a published tier
  table.
