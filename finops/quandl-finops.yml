meters:
  - name: dataset_subscription
    description: Per-dataset subscription fee for premium Nasdaq Data Link content; rate is set on
      the data.nasdaq.com product page for each dataset.
    unit: month
    aggregation: sum
    dimensions:
      - dataset
      - account
  - name: api_requests
    description: REST and Streaming API requests against the subscribed datasets; subject to per-account
      throttling rather than per-call billing.
    unit: request
    aggregation: sum
    dimensions:
      - dataset
      - api_key
principles:
  - name: Visibility
    description: Track subscribed datasets and per-account API key usage through the data.nasdaq.com
      account dashboard; export invoice line items into the internal cost-management system.
  - name: Allocation
    description: Allocate per-dataset subscription fees against the analytics or trading desk consuming
      each dataset; tag API keys per consuming application.
  - name: Optimization
    description: Audit subscribed datasets quarterly; cancel datasets that no longer drive analyses,
      and consolidate access against an enterprise contract when multiple desks subscribe to the same
      provider.
  - name: Accountability
    description: Data leadership owns the dataset catalog; finance reviews per-dataset spend at renewal.
